apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: analytics-service
  namespace: argocd
spec:
  project: default
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: analytics-secret
      namespace: ns-analytics
      jsonPointers:
        - /data
        - /stringData
  source:
    repoURL: https://github.com/VianaCoder/togglemaster-monorepo.git
    targetRevision: main
    path: gitops/services/analytics-service
  destination:
    server: https://kubernetes.default.svc
    namespace: ns-analytics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
