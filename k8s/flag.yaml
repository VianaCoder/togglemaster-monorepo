apiVersion: v1
kind: ConfigMap
metadata:
  name: flag-config
  namespace: ns-flag
data:
  PORT: "8002"
  AUTH_SERVICE_URL: http://auth-service.ns-auth.svc.cluster.local:8001
---
apiVersion: v1
kind: Secret
metadata:
  name: flag-secret
  namespace: ns-flag
type: Opaque
stringData:
  DATABASE_URL: "REDACTED_DATABASE_URL"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: ns-flag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/flag-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: flag-config
            - secretRef:
                name: flag-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: ns-flag
spec:
  type: ClusterIP
  selector:
    app: flag-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
