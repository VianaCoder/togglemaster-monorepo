apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VianaCoder/togglemaster-monorepo.git
    targetRevision: main
    path: gitops/services/auth-service
  destination:
    server: https://kubernetes.default.svc
    namespace: ns-auth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
