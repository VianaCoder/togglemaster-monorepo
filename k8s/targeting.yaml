apiVersion: v1
kind: ConfigMap
metadata:
  name: targeting-config
  namespace: ns-targeting
data:
  PORT: "8003"
  AUTH_SERVICE_URL: http://auth-service.ns-auth.svc.cluster.local:8001
---
apiVersion: v1
kind: Secret
metadata:
  name: targeting-secret
  namespace: ns-targeting
type: Opaque
stringData:
  DATABASE_URL: "REDACTED_DATABASE_URL"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: ns-targeting
spec:
  replicas: 2
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      containers:
        - name: targeting-service
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/targeting-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: targeting-config
            - secretRef:
                name: targeting-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: ns-targeting
spec:
  type: ClusterIP
  selector:
    app: targeting-service
  ports:
    - name: http
      port: 8003
      targetPort: 8003
