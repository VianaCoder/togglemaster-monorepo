name: Sync Kubernetes Secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-k8s-secrets.yml

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'togglemaster-dev-eks' }}

jobs:
  sync-secrets:
    name: Sync Runtime Secrets to EKS
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          kubectl config current-context

      - name: Validate required GitHub Secrets
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          AUTH_MASTER_KEY: ${{ secrets.AUTH_MASTER_KEY }}
          FLAG_DATABASE_URL: ${{ secrets.FLAG_DATABASE_URL }}
          TARGETING_DATABASE_URL: ${{ secrets.TARGETING_DATABASE_URL }}
          EVALUATION_REDIS_URL: ${{ secrets.EVALUATION_REDIS_URL }}
          EVALUATION_SERVICE_API_KEY: ${{ secrets.EVALUATION_SERVICE_API_KEY }}
          AWS_SQS_URL: ${{ secrets.AWS_SQS_URL }}
        run: |
          missing=0
          for key in \
            AUTH_DATABASE_URL \
            AUTH_MASTER_KEY \
            FLAG_DATABASE_URL \
            TARGETING_DATABASE_URL \
            EVALUATION_REDIS_URL \
            EVALUATION_SERVICE_API_KEY \
            AWS_SQS_URL; do
            if [ -z "${!key}" ]; then
              echo "Missing required GitHub secret: $key"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Apply auth-service secret
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          AUTH_MASTER_KEY: ${{ secrets.AUTH_MASTER_KEY }}
        run: |
          kubectl -n ns-auth create secret generic auth-secret \
            --from-literal=DATABASE_URL="$AUTH_DATABASE_URL" \
            --from-literal=MASTER_KEY="$AUTH_MASTER_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply flag-service secret
        env:
          FLAG_DATABASE_URL: ${{ secrets.FLAG_DATABASE_URL }}
        run: |
          kubectl -n ns-flag create secret generic flag-secret \
            --from-literal=DATABASE_URL="$FLAG_DATABASE_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply targeting-service secret
        env:
          TARGETING_DATABASE_URL: ${{ secrets.TARGETING_DATABASE_URL }}
        run: |
          kubectl -n ns-targeting create secret generic targeting-secret \
            --from-literal=DATABASE_URL="$TARGETING_DATABASE_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply evaluation-service secret
        env:
          EVALUATION_REDIS_URL: ${{ secrets.EVALUATION_REDIS_URL }}
          AWS_SQS_URL: ${{ secrets.AWS_SQS_URL }}
          EVALUATION_SERVICE_API_KEY: ${{ secrets.EVALUATION_SERVICE_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          kubectl -n ns-evaluation create secret generic evaluation-secret \
            --from-literal=REDIS_URL="$EVALUATION_REDIS_URL" \
            --from-literal=AWS_SQS_URL="$AWS_SQS_URL" \
            --from-literal=SERVICE_API_KEY="$EVALUATION_SERVICE_API_KEY" \
            --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply analytics-service secret
        env:
          AWS_SQS_URL: ${{ secrets.AWS_SQS_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ANALYTICS_DYNAMODB_TABLE: ${{ vars.ANALYTICS_DYNAMODB_TABLE || 'ToggleMasterAnalytics' }}
        run: |
          kubectl -n ns-analytics create secret generic analytics-secret \
            --from-literal=AWS_SQS_URL="$AWS_SQS_URL" \
            --from-literal=AWS_DYNAMODB_TABLE="$ANALYTICS_DYNAMODB_TABLE" \
            --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Restart deployments to pick up new secrets
        run: |
          kubectl -n ns-auth rollout restart deploy/auth-service
          kubectl -n ns-flag rollout restart deploy/flag-service
          kubectl -n ns-targeting rollout restart deploy/targeting-service
          kubectl -n ns-evaluation rollout restart deploy/evaluation-service
          kubectl -n ns-analytics rollout restart deploy/analytics-service

      - name: Wait for rollouts
        run: |
          kubectl -n ns-auth rollout status deploy/auth-service --timeout=300s
          kubectl -n ns-flag rollout status deploy/flag-service --timeout=300s
          kubectl -n ns-targeting rollout status deploy/targeting-service --timeout=300s
          kubectl -n ns-evaluation rollout status deploy/evaluation-service --timeout=300s
          kubectl -n ns-analytics rollout status deploy/analytics-service --timeout=300s
