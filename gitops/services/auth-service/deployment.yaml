apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: ns-auth
data:
  PORT: "8001"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
  namespace: ns-auth
type: Opaque
stringData:
  DATABASE_URL: "REDACTED_DATABASE_URL"
  MASTER_KEY: "REDACTED_MASTER_KEY"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ns-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 127214161915.dkr.ecr.us-east-1.amazonaws.com/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: auth-config
            - secretRef:
                name: auth-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ns-auth
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
