apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-config
  namespace: ns-analytics
data:
  PORT: "8005"
  AWS_REGION: "us-east-2"
---
apiVersion: v1
kind: Secret
metadata:
  name: analytics-secret
  namespace: ns-analytics
type: Opaque
stringData:
  AWS_SQS_URL: "https://sqs.<AWS_REGION>.amazonaws.com/<AWS_ACCOUNT_ID>/toggle-master-events"
  AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: ns-analytics
spec:
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: 127214161915.dkr.ecr.us-east-1.amazonaws.com/analytics-service:v1.0.0-367ce7e
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef:
                name: analytics-config
            - secretRef:
                name: analytics-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: ns-analytics
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
    - name: http
      port: 8005
      targetPort: 8005
