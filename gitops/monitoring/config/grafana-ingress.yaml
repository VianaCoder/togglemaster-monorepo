---
# Grafana Ingress — exposes Grafana at https://grafana.gvianalourenco.xyz
# TLS is handled by cert-manager with the letsencrypt-prod ClusterIssuer.
#
# The Grafana Service name is: kube-prometheus-stack-grafana (from Helm release name)
#
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.gvianalourenco.xyz
      secretName: grafana-tls
  rules:
    - host: grafana.gvianalourenco.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
