# kube-prometheus-stack Helm values for ToggleMaster
# Chart: prometheus-community/kube-prometheus-stack
# Ref: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack

# ============================================================
# Prometheus
# ============================================================
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: "18GB"
    scrapeInterval: "30s"
    evaluationInterval: "30s"

    # Discover ServiceMonitors and PodMonitors from ALL namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}

    resources:
      requests:
        cpu: "200m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

# ============================================================
# Alertmanager
# ============================================================
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"

# ============================================================
# Grafana
# ============================================================
grafana:
  enabled: true
  # NOTE: Override this password via a Kubernetes Secret in production.
  # kubectl create secret generic grafana-admin -n monitoring \
  #   --from-literal=admin-user=admin \
  #   --from-literal=admin-password=<YOUR_SECURE_PASSWORD>
  adminPassword: "togglemaster-observability"

  # Sidecar auto-discovers dashboards and datasources from ConfigMaps
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      searchNamespace: ALL

  # Loki datasource (provisioned automatically)
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
      version: 1
      editable: false
      jsonData:
        maxLines: 1000

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  grafana.ini:
    server:
      root_url: "https://grafana.gvianalourenco.xyz"
    security:
      allow_embedding: true
    auth.anonymous:
      enabled: false

# ============================================================
# Disable components not available in managed EKS
# (etcd, scheduler, controller-manager endpoints are not exposed)
# ============================================================
kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

kubeProxy:
  enabled: false

# ============================================================
# kube-state-metrics and node-exporter
# ============================================================
kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

# ============================================================
# Default Prometheus alerting rules
# ============================================================
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: true
    general: true
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryCache: true
    k8sContainerMemoryRss: true
    k8sContainerMemorySwap: true
    k8sPodOwner: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubelet: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesAbsent: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeStateMetricsErrors: true
    kubeStateMetricsSharding: false
    networkPolicy: false
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
